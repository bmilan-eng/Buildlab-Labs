<script>
    /* ==========================================================================
       1. LÓGICA DE FONDO 3D Y AUTENTICACIÓN DEL INDEX V2
       ========================================================================== */
    const bgCanvas = document.getElementById('bg-canvas');
    const bgScene = new THREE.Scene();
    const bgCamera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const bgRenderer = new THREE.WebGLRenderer({ canvas: bgCanvas, antialias: true, alpha: true });
    bgRenderer.setSize(window.innerWidth, window.innerHeight);

    const geometry = new THREE.BoxGeometry(1, 1, 1);
    const material = new THREE.MeshBasicMaterial({ color: 0x00f0ff, wireframe: true });
    const cubes = [];
    for (let i = 0; i < 40; i++) {
      const cube = new THREE.Mesh(geometry, material);
      cube.position.set((Math.random() - 0.5) * 30, (Math.random() - 0.5) * 30, (Math.random() - 0.5) * 30);
      cube.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
      bgScene.add(cube);
      cubes.push(cube);
    }
    bgCamera.position.z = 15;

    function animateBg() {
      requestAnimationFrame(animateBg);
      cubes.forEach(c => {
        c.rotation.x += 0.005;
        c.rotation.y += 0.008;
      });
      bgRenderer.render(bgScene, bgCamera);
    }
    animateBg();

    // Sistema de Login/Registro de Index V2 y PeerJS
    const tabLogin = document.getElementById('tab-login');
    const tabRegister = document.getElementById('tab-register');
    const formLogin = document.getElementById('form-login');
    const formRegister = document.getElementById('form-register');
    const authModal = document.getElementById('auth-modal');
    const lobbyContainer = document.getElementById('lobby-container');
    const playerName = document.getElementById('player-name');
    const btnLogout = document.getElementById('btn-logout');

    let currentUsername = '';
    let peer = null;
    let activeConnection = null;
    let pendingConnection = null;

    tabLogin.addEventListener('click', () => {
      tabLogin.classList.add('active');
      tabRegister.classList.remove('active');
      formLogin.classList.remove('hidden');
      formRegister.classList.add('hidden');
    });

    tabRegister.addEventListener('click', () => {
      tabRegister.classList.add('active');
      tabLogin.classList.remove('active');
      formRegister.classList.remove('hidden');
      formLogin.classList.add('hidden');
    });

    function formatPeerId(nick) {
      return 'arena1v1-' + nick.toLowerCase().trim().replace(/[^a-z0-9]/g, '');
    }

    function initUserSession(user) {
      currentUsername = user.trim();
      playerName.textContent = currentUsername;
      authModal.classList.add('hidden');
      lobbyContainer.classList.remove('hidden');

      initPeerJS(currentUsername);
    }

    formLogin.addEventListener('submit', (e) => {
      e.preventDefault();
      const user = document.getElementById('login-username').value;
      if (user) initUserSession(user);
    });

    formRegister.addEventListener('submit', (e) => {
      e.preventDefault();
      const user = document.getElementById('reg-username').value;
      if (user) initUserSession(user);
    });

    btnLogout.addEventListener('click', () => {
      if (peer) peer.destroy();
      lobbyContainer.classList.add('hidden');
      authModal.classList.remove('hidden');
      updateRoomStatus('disconnected', 'Desconectado');
    });

    // Selección de Modos de Juego en el Lobby Principal
    let currentMode = '1v1';
    const modeCards = document.querySelectorAll('.mode-card');
    modeCards.forEach(card => {
      card.addEventListener('click', () => {
        modeCards.forEach(c => c.classList.remove('active'));
        card.classList.add('active');
        currentMode = card.getAttribute('data-mode');
      });
    });

    /* ==========================================================================
       2. SISTEMA PEERJS - INVITACIONES Y SALA MULTIJUGADOR POR NICK
       ========================================================================== */
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const myPeerIdElem = document.getElementById('my-peer-id');
    const targetPeerInput = document.getElementById('target-peer-id');
    const btnConnectPeer = document.getElementById('btn-connect-peer');
    const inviteNotification = document.getElementById('invite-notification');
    const inviterNameElem = document.getElementById('inviter-name');
    const btnAcceptInvite = document.getElementById('btn-accept-invite');
    const btnRejectInvite = document.getElementById('btn-reject-invite');

    targetPeerInput.placeholder = "Nick de tu amigo...";

    function updateRoomStatus(state, text) {
      statusDot.className = `dot ${state}`;
      statusText.textContent = text;
    }

    function initPeerJS(username) {
      const myPeerId = formatPeerId(username);
      if (peer) peer.destroy();

      peer = new Peer(myPeerId);

      peer.on('open', () => {
        myPeerIdElem.textContent = username;
        updateRoomStatus('connected', 'En línea (Listo para invitar)');
      });

      peer.on('error', (err) => {
        console.error('PeerJS Error:', err);
        if (err.type === 'peer-not-found') {
          alert('No se encontró a ningún jugador en línea con ese Nick.');
        } else if (err.type === 'unavailable-id') {
          alert('Ese Nick ya está conectado en otra sesión.');
        } else {
          alert('Error de conexión: ' + err.type);
        }
        updateRoomStatus('disconnected', 'Error de conexión');
      });

      // Recibir conexión entrante de un amigo
      peer.on('connection', (conn) => {
        pendingConnection = conn;

        conn.on('data', (data) => {
          if (data.type === 'invite') {
            inviterNameElem.textContent = data.from;
            inviteNotification.classList.remove('hidden');
          } else if (data.type === 'cancel') {
            inviteNotification.classList.add('hidden');
            pendingConnection = null;
          }
        });

        conn.on('close', () => {
          updateRoomStatus('disconnected', 'El rival se ha desconectado');
          activeConnection = null;
        });
      });
    }

    // Enviar invitación a un amigo por Nick
    btnConnectPeer.addEventListener('click', () => {
      const friendNick = targetPeerInput.value.trim();
      if (!friendNick) {
        alert('Escribe el Nick de tu amigo.');
        return;
      }
      if (friendNick.toLowerCase() === currentUsername.toLowerCase()) {
        alert('No puedes invitarte a ti mismo.');
        return;
      }

      const friendPeerId = formatPeerId(friendNick);
      updateRoomStatus('waiting', `Enviando invitación a ${friendNick}...`);

      const conn = peer.connect(friendPeerId);
      activeConnection = conn;

      conn.on('open', () => {
        conn.send({ type: 'invite', from: currentUsername });
      });

      conn.on('data', (data) => {
        if (data.type === 'accept') {
          updateRoomStatus('connected', `En sala con: ${data.from}`);
          alert(`¡${data.from} aceptó tu invitación! Estás en sala con él.`);
        } else if (data.type === 'reject') {
          updateRoomStatus('connected', 'En línea (Listo para invitar)');
          alert(`${data.from} rechazó la invitación.`);
          conn.close();
          activeConnection = null;
        }
      });

      conn.on('close', () => {
        updateRoomStatus('disconnected', 'Conexión cerrada');
        activeConnection = null;
      });
    });

    // Aceptar invitación recibida
    btnAcceptInvite.addEventListener('click', () => {
      if (pendingConnection) {
        activeConnection = pendingConnection;
        activeConnection.send({ type: 'accept', from: currentUsername });
        inviteNotification.classList.add('hidden');
        updateRoomStatus('connected', `En sala con: ${inviterNameElem.textContent}`);
      }
    });

    // Rechazar invitación recibida
    btnRejectInvite.addEventListener('click', () => {
      if (pendingConnection) {
        pendingConnection.send({ type: 'reject', from: currentUsername });
        inviteNotification.classList.add('hidden');
        pendingConnection.close();
        pendingConnection = null;
      }
    });

    /* ==========================================================================
       3. NAVEGACIÓN Y APERTURA DE MENÚ AIMLABS / PASE DE BAZA
       ========================================================================== */
    const btnPassAimlabs = document.getElementById('btn-pass-aimlabs');
    const menuContainer = document.getElementById('menu-container');
    const btnCloseAimlabsMenu = document.getElementById('btn-close-aimlabs-menu');
    let isPassViewMode = false;

    btnPassAimlabs.addEventListener('click', () => {
      isPassViewMode = true;
      menuContainer.style.display = 'flex';
      initAudio();
      playButtonClickSound();
    });

    btnCloseAimlabsMenu.addEventListener('click', () => {
      menuContainer.style.display = 'none';
      isPassViewMode = false;
      initAudio();
      playButtonClickSound();
    });

    const btnPlayGame = document.getElementById('btn-play-game');
    btnPlayGame.addEventListener('click', () => {
      if (currentMode === 'aimlabs') {
        startAimlabsDirectly();
      } else if (currentMode === '1v1') {
        if (activeConnection && activeConnection.open) {
          alert("¡Iniciando combate 1v1 con tu rival conectado!");
        } else {
          alert("Debes invitar a un amigo por su Nick o estar conectado en una sala para jugar 1v1.");
        }
      } else if (currentMode === 'practice') {
        alert("Iniciando Modo Práctica Libre...");
      }
    });

    function startAimlabsDirectly() {
      const status = checkBanStatus();
      if (status.isBanned) {
        alert(`🚫 Tu cuenta está suspendida.\nTiempo restante: ${status.formatted}`);
        return;
      }
      initAudio();
      playButtonClickSound();

      lobbyContainer.classList.add('hidden');
      menuContainer.style.display = 'none';
      document.body.requestPointerLock();
    }

    /* ==========================================================================
       4. SISTEMA Y LÓGICA COMPLETA DE AIMLABS CS2
       ========================================================================== */
    let audioCtx = null;
    let soundVolume = parseFloat(localStorage.getItem('aimlabs_sound_vol')) || 0.5;

    function checkBanStatus() {
      const banUntil = parseInt(localStorage.getItem('aimlabs_banned_until')) || 0;
      const now = Date.now();
      if (now < banUntil) {
        const diffSecs = Math.ceil((banUntil - now) / 1000);
        const mins = Math.floor(diffSecs / 60);
        const secs = diffSecs % 60;
        return { isBanned: true, mins, secs, formatted: `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}` };
      }
      return { isBanned: false };
    }

    setInterval(() => {
      const status = checkBanStatus();
      const banBanner = document.getElementById('ban-banner');
      const banTimer = document.getElementById('ban-timer');

      if (status.isBanned) {
        banBanner.style.display = 'block';
        banTimer.textContent = status.formatted;
        startBtn.disabled = true;
        startBtn.textContent = 'CUENTA SUSPENDIDA';
      } else if (startBtn.textContent === 'CUENTA SUSPENDIDA') {
        banBanner.style.display = 'none';
        startBtn.disabled = false;
        startBtn.textContent = 'INICIAR ENTRENAMIENTO';
      }
    }, 1000);

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playButtonClickSound() {
      if (!audioCtx || soundVolume <= 0) return;
      try {
        const osc = audioCtx.currentTime;
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(500, audioCtx.currentTime);
        o.frequency.exponentialRampToValueAtTime(250, audioCtx.currentTime + 0.04);
        g.gain.setValueAtTime(soundVolume * 0.2, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
        o.connect(g);
        g.connect(audioCtx.destination);
        o.start();
        o.stop(audioCtx.currentTime + 0.04);
      } catch(e) {}
    }

    const startBtn = document.getElementById('start-btn');
    const coinsVal = document.getElementById('coins-val');
    let coins = parseInt(localStorage.getItem('aimlabs_coins')) || 10;
    coinsVal.textContent = coins;
  </script>
